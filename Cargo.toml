[package]
name = "plexpaper"
version = "2.0.1"
authors = ["Lucawyck <team@plexscale.com>"]
license = "GPL-3.0"
description = "A sleeping reverse proxy for Paper Minecraft servers, by @lucawyck."
edition = "2021"
rust-version = "1.74.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[features]
default = ["rcon", "lobby"]
rcon = ["rust_rcon"]
lobby = ["md-5", "uuid"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.1"
chrono = "0.4"
colored = "2.0"
derive_builder = "0.20"
flate2 = { version = "1.0", default-features = false, features = ["default"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
log = "0.4"
minecraft-protocol = { git = "https://github.com/timvisee/rust-minecraft-protocol", rev = "4f93bb3" }
named-binary-tag = "0.6"
nix = { version = "0.28", features = ["process", "signal"] }
notify = { version = "7.0", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-mini = { version = "0.5", default-features = false }
env_logger = { version = "0.10", default-features = false, features = ["color"] }
proxy-protocol = "0.5"
quartz_nbt = "0.2"
rand = "0.8"
serde = "1.0"
serde_json = "1.0"
shlex = "1.3"
thiserror = "1.0"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "io-util",
    "net",
    "macros",
    "time",
    "process",
    "signal",
    "sync",
    "fs",
] }

rust_rcon = { package = "rcon", version = "0.6", default-features = false, features = ["rt-tokio"], optional = true }

md-5 = { version = "0.10", optional = true }
uuid = { version = "1.7", optional = true, features = ["v3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "processthreadsapi",
    "handleapi",
    "ntdef",
    "minwindef",
] }
